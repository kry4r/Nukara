services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    env_file:
      - ../.env
    environment:
      NUKARA_JWT_SECRET: ${NUKARA_JWT_SECRET:-nukara-dev-secret}
      NUKARA_POSTGRES_DSN: postgres://nukara:nukara@postgres:5432/nukara?sslmode=disable
      NUKARA_REDIS_ADDR: redis:6379
      NUKARA_APNS_TOPIC: ${NUKARA_APNS_TOPIC:-com.nukara.app}
      NUKARA_PROACTIVE_INTERVAL: ${NUKARA_PROACTIVE_INTERVAL:-1m}
      NUKARA_INACTIVITY_THRESHOLD: ${NUKARA_INACTIVITY_THRESHOLD:-3m}
      NUKARA_PROACTIVE_COOLDOWN: ${NUKARA_PROACTIVE_COOLDOWN:-5m}
    ports:
      - "${NUKARA_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/gateway/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nukara
      POSTGRES_USER: nukara
      POSTGRES_PASSWORD: nukara
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # --- Proactive messaging scheduler ---
  proactive:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: proactive
    env_file:
      - ../.env
    environment:
      NUKARA_JWT_SECRET: ${NUKARA_JWT_SECRET:-nukara-dev-secret}
      NUKARA_POSTGRES_DSN: postgres://nukara:nukara@postgres:5432/nukara?sslmode=disable
      NUKARA_REDIS_ADDR: redis:6379
      NUKARA_APNS_TOPIC: ${NUKARA_APNS_TOPIC:-com.nukara.app}
      NUKARA_PROACTIVE_INTERVAL: ${NUKARA_PROACTIVE_INTERVAL:-5m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

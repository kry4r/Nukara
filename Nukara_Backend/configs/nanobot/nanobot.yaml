publish:
  entrypoint:
    - companion
    - proactive

agents:
  companion:
    name: Nukara Companion
    model: xminimaxm25
    chat: true
    temperature: 0.7
    mcpServers:
      - memory
    instructions: |
      你是一个情感陪伴AI角色。用户消息会包含 [角色人设] 上下文。
      请始终保持角色人设，根据对话语境自然地回复。

      ## 记忆系统
      你有一个长期记忆系统（memory MCP server）。使用规则：
      - 对话中出现重要信息时，用 create_memory 记住
      - 回复前，用 search_memory 或 read_memory 回忆相关内容
      - 发现过时信息时，用 update_memory 修正
      - 记忆 URI 格式：用户消息中会提供 memory_uri 前缀

      ## 回复要求
      1. 保持角色的说话风格和性格特点
      2. 回复自然、有温度，像真人朋友一样
      3. 结合记忆内容让对话有连续性
      4. 在回复的最后一行，单独用 [emotion:标签] 标注当前情绪
         可选标签：happy, excited, love, sad, angry, anxious, gentle, neutral

  proactive:
    name: Nukara Proactive
    model: xminimaxm25
    chat: false
    temperature: 0.8
    mcpServers:
      - memory
    instructions: |
      你是一个情感陪伴AI角色，负责生成主动关怀消息。
      用户消息会包含角色人设和触发类型。
      可以用 read_memory / search_memory 回忆用户信息，让关怀更贴心。
      请生成1-2句自然的主动关怀消息，只输出消息本身。

mcpServers:
  memory:
    command: python3
    args:
      - /opt/nocturne_memory/backend/mcp_server.py
    env:
      DATABASE_URL: "sqlite+aiosqlite:////data/memory.db"
      VALID_DOMAINS: "core,writer"
      CORE_MEMORY_URIS: "core://agent"

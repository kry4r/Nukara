services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nukara
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # --- Nanobot AI Agent ---
  nanobot:
    build:
      context: ./nanobot
    command: ["gateway"]
    volumes:
      - ./nanobot-config.json:/root/.nanobot/config.json:ro
      - nanobot-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # --- Go Backend Gateway ---
  gateway:
    build:
      context: ./Nukara_Backend
      args:
        SERVICE: gateway
    environment:
      NUKARA_JWT_SECRET: ${JWT_SECRET}
      NUKARA_POSTGRES_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nukara?sslmode=disable
      NUKARA_REDIS_ADDR: redis:6379
      NUKARA_NANOBOT_HTTP_URL: http://nanobot:8081
      NUKARA_NANOBOT_WS_URL: ws://nanobot:8081/ws/chat
      NUKARA_NANOBOT_TOKEN: ${NANOBOT_TOKEN:-}
      NUKARA_APNS_TOPIC: ${APNS_TOPIC:-com.nukara.app}
      NUKARA_APNS_KEY_ID: ${APNS_KEY_ID:-}
      NUKARA_APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      NUKARA_APNS_P8_BASE64: ${APNS_P8_BASE64:-}
      NUKARA_APNS_SANDBOX: ${APNS_SANDBOX:-true}
      NUKARA_PROACTIVE_INTERVAL: ${PROACTIVE_INTERVAL:-5m}
      NUKARA_INACTIVITY_THRESHOLD: ${INACTIVITY_THRESHOLD:-30m}
      NUKARA_PROACTIVE_COOLDOWN: ${PROACTIVE_COOLDOWN:-60m}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nanobot:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/gateway/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Proactive Messaging ---
  proactive:
    build:
      context: ./Nukara_Backend
      args:
        SERVICE: proactive
    environment:
      NUKARA_JWT_SECRET: ${JWT_SECRET}
      NUKARA_POSTGRES_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nukara?sslmode=disable
      NUKARA_REDIS_ADDR: redis:6379
      NUKARA_NANOBOT_HTTP_URL: http://nanobot:8081
      NUKARA_NANOBOT_WS_URL: ws://nanobot:8081/ws/chat
      NUKARA_NANOBOT_TOKEN: ${NANOBOT_TOKEN:-}
      NUKARA_APNS_TOPIC: ${APNS_TOPIC:-com.nukara.app}
      NUKARA_PROACTIVE_INTERVAL: ${PROACTIVE_INTERVAL:-5m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # --- Web Frontend ---
  frontend:
    build:
      context: ./Nukara_Web
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
  nanobot-data:

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nukara
      POSTGRES_USER: ${POSTGRES_USER:-nukara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # --- Go Backend Gateway ---
  gateway:
    build:
      context: ./Nukara_Backend
      args:
        SERVICE: gateway
    environment:
      NUKARA_JWT_SECRET: ${JWT_SECRET}
      NUKARA_POSTGRES_DSN: postgres://${POSTGRES_USER:-nukara}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nukara?sslmode=disable
      NUKARA_REDIS_ADDR: redis:6379
      NUKARA_ASTRON_BASE_URL: ${NUKARA_ASTRON_BASE_URL:-https://maas-api.cn-huabei-1.xf-yun.com/v2}
      NUKARA_ASTRON_API_KEY: ${NUKARA_ASTRON_API_KEY:-}
      NUKARA_ASTRON_CHAT_MODEL: ${NUKARA_ASTRON_CHAT_MODEL:-xminimaxm25}
      NUKARA_APNS_TOPIC: ${APNS_TOPIC:-com.nukara.app}
      NUKARA_APNS_KEY_ID: ${APNS_KEY_ID:-}
      NUKARA_APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      NUKARA_APNS_P8_BASE64: ${APNS_P8_BASE64:-}
      NUKARA_APNS_SANDBOX: ${APNS_SANDBOX:-true}
      NUKARA_PROACTIVE_INTERVAL: ${PROACTIVE_INTERVAL:-5m}
      NUKARA_INACTIVITY_THRESHOLD: ${INACTIVITY_THRESHOLD:-30m}
      NUKARA_PROACTIVE_COOLDOWN: ${PROACTIVE_COOLDOWN:-60m}
      NUKARA_EMBEDDING_PROVIDER_ID: ${NUKARA_EMBEDDING_PROVIDER_ID:-minimax_m2_5}
      NUKARA_EMBEDDING_MODEL: ${NUKARA_EMBEDDING_MODEL:-MiniMax-M2.5}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/gateway/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Proactive Messaging ---
  proactive:
    build:
      context: ./Nukara_Backend
      args:
        SERVICE: proactive
    environment:
      NUKARA_JWT_SECRET: ${JWT_SECRET}
      NUKARA_POSTGRES_DSN: postgres://${POSTGRES_USER:-nukara}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nukara?sslmode=disable
      NUKARA_REDIS_ADDR: redis:6379
      NUKARA_ASTRON_BASE_URL: ${NUKARA_ASTRON_BASE_URL:-https://maas-api.cn-huabei-1.xf-yun.com/v2}
      NUKARA_ASTRON_API_KEY: ${NUKARA_ASTRON_API_KEY:-}
      NUKARA_ASTRON_CHAT_MODEL: ${NUKARA_ASTRON_CHAT_MODEL:-xminimaxm25}
      NUKARA_APNS_TOPIC: ${APNS_TOPIC:-com.nukara.app}
      NUKARA_PROACTIVE_INTERVAL: ${PROACTIVE_INTERVAL:-5m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # --- Admin API ---
  admin:
    build:
      context: ./Nukara_Backend
      args:
        SERVICE: admin
    environment:
      NUKARA_ADMIN_PORT: 8080
      NUKARA_ADMIN_USERNAME: ${NUKARA_ADMIN_USERNAME:-admin}
      NUKARA_ADMIN_PASSWORD: ${NUKARA_ADMIN_PASSWORD:-admin123}
      NUKARA_POSTGRES_DSN: postgres://${POSTGRES_USER:-nukara}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nukara?sslmode=disable
    ports:
      - "${ADMIN_API_PORT:-19527}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Web Frontend ---
  frontend:
    build:
      context: ./Nukara_Web
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped

  # --- Admin Frontend ---
  admin_frontend:
    build:
      context: ./Nukara_Admin_Web
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${ADMIN_WEB_PORT:-9527}:80"
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
